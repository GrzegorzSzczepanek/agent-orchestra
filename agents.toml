# Konfiguracja agentów. Komendy do weryfikacji na swojej maszynie (patrz README).
# acp: komenda uruchamiająca serwer ACP po stdio (jeden proces, jeden katalog projektu)
# env_passthrough: zmienne środowiskowe przekazywane agentowi ACP (SDK domyślnie daje okrojone środowisko)
# headless: szablon komendy trybu nieinteraktywnego, {task} i {model} są podstawiane

[roles]
planner = "claude"
reviewer = "claude"
implementer = "commandcode"
researcher = "antigravity"

[agents.claude]
description = "Claude Code przez oficjalny adapter ACP (niezmodyfikowany binarny claude na własnym koncie)"
acp = ["claude-agent-acp"]
# env_passthrough celowo puste: logowanie subskrypcją. Wpisz ["ANTHROPIC_API_KEY"] tylko gdy chcesz rozliczanie przez API
headless = ["claude", "-p", "{task}", "--output-format", "json"]
tier = "strong"

[agents.codex]
description = "Codex CLI przez adapter ACP"
acp = ["codex-acp"]
# env_passthrough celowo puste (logowanie kontem); dla klucza API wpisz ["OPENAI_API_KEY"]
headless = ["codex", "exec", "{task}"]
tier = "strong"

[agents.antigravity]
description = "Antigravity CLI (agy), natywny ACP od wersji 1.5.0"
acp = ["agy", "acp"]
# env_passthrough puste: logowanie kontem Google; dla klucza API dopisz zmienne wg dokumentacji agy
headless = ["agy", "-p", "{task}"]
tier = "strong"

[agents.opencode]
description = "OpenCode, natywny ACP"
acp = ["opencode", "acp"]
headless = ["opencode", "run", "{task}"]
tier = "cheap"

[agents.commandcode]
description = "Command Code (commandcode.ai), plan Go działa tylko przez CLI"
acp = ["cmd", "acp"]
env_passthrough = ["COMMAND_CODE_API_KEY", "CMD_ZDR", "CMD_LOCAL_ONLY"]
# --no-skills i --safe-mode odcinają katalog skilli i mody. Wpływ na tokeny jest w granicach szumu (patrz README).
headless = ["cmd", "-p", "{task}", "--model", "{model}", "--output-format", "json", "--max-turns", "30", "--yolo", "--skip-onboarding", "--no-skills", "--safe-mode"]
# Model: ID z `cmd --list-models` (pełne albo część po ostatnim "/"). Brak modelu to jasny błąd.
# Zmienna ORCHESTRA_CMD_MODEL ma pierwszeństwo przed default_model.
model_env = "ORCHESTRA_CMD_MODEL"
default_model = "deepseek/deepseek-v4.1-flash"
require_model = true
tier = "cheap"

# Konfiguracja agentów. Komendy do weryfikacji na swojej maszynie (patrz README).
# acp: komenda uruchamiająca serwer ACP po stdio (jeden proces, jeden katalog projektu)
# env_passthrough: zmienne środowiskowe przekazywane agentowi (ACP i headless dostają okrojone środowisko)
# headless: szablon komendy trybu nieinteraktywnego, {task} i {model} są podstawiane

# Gdy agent roli nie jest zainstalowany, rola przechodzi na pierwszego dostępnego z tej listy
# (potem na dowolnego innego z pliku). Wybór można zmienić w TUI (przycisk Role) albo `orchestra roles`.
# Własne agenty i modele dopisz w ~/.config/orchestra/agents.toml albo <repo>/.orchestra/agents.toml.
fallback_order = ["claude", "commandcode", "opencode", "codex", "antigravity"]

# Workery i test_cmd dostają okrojone środowisko (PATH, HOME, locale, proxy). Dodatkowe zmienne dla testów wpisz tu,
# a dla agentów w ich env_passthrough.
test_env_passthrough = []

[roles]
planner = "claude"
reviewer = "claude"
implementer = "commandcode"
researcher = "antigravity"

[agents.claude]
description = "Claude Code przez oficjalny adapter ACP (niezmodyfikowany binarny claude na własnym koncie)"
acp = ["claude-agent-acp"]
# env_passthrough celowo puste: logowanie subskrypcją. Wpisz ["ANTHROPIC_API_KEY"] tylko gdy chcesz rozliczanie przez API
headless = ["claude", "-p", "{task}", "--output-format", "json"]
tier = "strong"

[agents.codex]
description = "Codex CLI przez adapter ACP"
acp = ["codex-acp"]
# env_passthrough celowo puste (logowanie kontem); dla klucza API wpisz ["OPENAI_API_KEY"]
headless = ["codex", "exec", "{task}"]
tier = "strong"

[agents.antigravity]
description = "Antigravity CLI (agy), natywny ACP od wersji 1.5.0"
acp = ["agy", "acp"]
# env_passthrough puste: logowanie kontem Google; dla klucza API dopisz zmienne wg dokumentacji agy
headless = ["agy", "-p", "{task}"]
tier = "strong"

[agents.opencode]
description = "OpenCode, natywny ACP"
acp = ["opencode", "acp"]
# --dangerously-skip-permissions: bez tego `opencode run` odrzuca edycje plików. Izolacją jest worktree.
# {model} to ID w formacie provider/model (np. opencode/big-pickle); puste, to model z konfiguracji opencode.
headless = ["opencode", "run", "{task}", "--model", "{model}", "--dangerously-skip-permissions"]
model_env = "ORCHESTRA_OPENCODE_MODEL"
tier = "cheap"

[agents.commandcode]
description = "Command Code (commandcode.ai), plan Go działa tylko przez CLI"
acp = ["cmd", "acp"]
env_passthrough = ["COMMAND_CODE_API_KEY", "CMD_ZDR", "CMD_LOCAL_ONLY"]
# --no-skills i --safe-mode odcinają katalog skilli i mody. Wpływ na tokeny jest w granicach szumu (patrz README).
headless = ["cmd", "-p", "{task}", "--model", "{model}", "--output-format", "json", "--max-turns", "30", "--yolo", "--skip-onboarding", "--no-skills", "--safe-mode"]
# Model: ID z `cmd --list-models` (pełne albo część po ostatnim "/"). Brak modelu to jasny błąd.
# Zmienna ORCHESTRA_CMD_MODEL ma pierwszeństwo przed default_model.
model_env = "ORCHESTRA_CMD_MODEL"
default_model = "deepseek/deepseek-v4.1-flash"
# Ceny w USD za 1M tokenów do szacowania kosztu (cmd go nie raportuje). Źródło: https://commandcode.ai/models/deepseek-v4-1-flash
# (stan na 2026-11-25). Wpisano pasmo peak ($0.30 in, $1.20 out) i pominięto rabat za cache ($0.006 vs $0.30 za 1M),
# więc szacunek jest górną granicą. Off-peak: 0.15 in, 0.60 out. Zmień przy innym modelu.
price_in_per_mtok = 0.30
price_out_per_mtok = 1.20
require_model = true
tier = "cheap"
